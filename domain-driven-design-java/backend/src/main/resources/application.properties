spring.application.name=rota-segura-api

# Porta: o Render define PORT; localmente usa 8080
server.port=${PORT:8080}

# Oracle da FIAP: valores so em variaveis de ambiente (veja .env.example)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA: as tabelas vem do ddl.sql (database-design/); o Hibernate so confere
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Sessao do login: 30 min; cookie liberado entre origens (SameSite=None exige Secure)
server.servlet.session.timeout=30m
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# Usuario fixo do painel: valores so em variaveis de ambiente
app.security.admin.username=${ADMIN_USERNAME}
app.security.admin.password=${ADMIN_PASSWORD}

# Origens do front com permissao de CORS (separadas por virgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
