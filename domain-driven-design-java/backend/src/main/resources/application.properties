spring.application.name=rota-segura-api

# Porta: o Render define PORT; localmente usa 8080
server.port=${PORT:8080}

# Oracle da FIAP: valores so em variaveis de ambiente (veja .env.example)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA: as tabelas vem do ddl.sql (database-design/); o Hibernate so confere
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
