spring.application.name=rota-segura-api

# Porta: o Render define PORT; localmente usa 8080
server.port=${PORT:8080}

# Atras do proxy do Render: le X-Forwarded-* para saber que a chamada original era https
server.forward-headers-strategy=framework

# Oracle da FIAP: valores so em variaveis de ambiente (veja .env.example)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool de conexoes: a conta do Oracle da FIAP aceita UMA sessao por vez (SESSIONS_PER_USER = 1).
# - no maximo 1 conexao;
# - nenhuma conexao parada fica aberta (minimum-idle=0): ela e devolvida ao Oracle entre 10 e 40 s
#   depois do ultimo uso (o Hikari confere a cada 30 s). Assim a versao nova da API (num deploy no Render)
#   e o SQL Developer conseguem a sessao;
# - quem esperar a conexao por mais de 10 s recebe erro, em vez de ficar travado;
# - na subida, se a sessao estiver ocupada, a API tenta de novo a cada 1 s por ate 60 s antes de desistir.
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=60000

# JPA: as tabelas vem do ddl.sql (database-design/); o Hibernate so confere
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Sessao do login: 30 min; cookie liberado entre origens (SameSite=None exige Secure)
server.servlet.session.timeout=30m
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# Usuario fixo do painel: valores so em variaveis de ambiente
app.security.admin.username=${ADMIN_USERNAME}
app.security.admin.password=${ADMIN_PASSWORD}

# Origens do front com permissao de CORS (separadas por virgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JSON: numero com casas decimais num campo inteiro (ex.: raio 500.9) vira erro 400, em vez de ser cortado
spring.jackson.deserialization.accept-float-as-int=false
# JSON: numero no lugar do texto de um enum (ex.: "status": 1) vira erro 400, em vez de ser lido pela posicao
spring.jackson.deserialization.fail-on-numbers-for-enums=true

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
