[project]
name = "rota-segura-dp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "pydantic"]

[project.optional-dependencies]
dev = ["pytest", "mypy", "hypothesis", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["rota_segura", "tests"]
